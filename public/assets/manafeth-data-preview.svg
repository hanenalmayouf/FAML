<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="650" viewBox="0 0 1320 650" role="img" aria-labelledby="title desc">
  <title id="title">عينة توضيحية من بيانات عملاء منافذ</title>
  <desc id="desc">جدول يعرض خمسة صفوف حقيقية وأعمدة مختارة من ملف منافذ، مع توضيح أن كل صف يمثل عميلاً وكل عمود يمثل خاصية وأن churned_30d هو الهدف.</desc>
